<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6e4f"><meta name="referrer" content="strict-origin-when-cross-origin"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230b6e4f%27/%3E%3Cpath d=%27M20 22h24M20 32h24M20 42h14%27 stroke=%27white%27 stroke-width=%275%27 stroke-linecap=%27round%27/%3E%3C/svg%3E"><title>Nouveau mot de passe — SipokMenu</title><meta name="description" content="Définissez un nouveau mot de passe."><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/app.css"><script src="/config.js"></script></head>
