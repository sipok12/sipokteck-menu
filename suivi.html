<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6e4f"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230b6e4f%27/%3E%3Cpath d=%27M20 22h24M20 32h24M20 42h14%27 stroke=%27white%27 stroke-width=%275%27 stroke-linecap=%27round%27/%3E%3C/svg%3E"><title>Suivi de commande — SipokMenu</title><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/menu.css"><link rel="stylesheet" href="/css/app.css"><script src="/config.js"></script></head>
<body class="menu-body">
<header class="menu-header"><a class="logo" href="/">SIPOK<span>MENU</span></a>
<div><button id="langToggle" type="button" class="outline sm" data-lang-toggle data-i18n-aria="nav.language">EN</button></div></header>
<main class="menu-main track-main">
<div id="loading" data-i18n="trk.loading">Chargement de votre commande…</div>
<div id="error" class="notice hidden" role="alert"></div>
<div id="track" class="hidden">
<section class="panel"><p class="muted" id="trRestaurant"></p><h1 id="trTitle"></h1><span id="trStatus" class="pill"></span>
<ol id="trSteps" class="track-steps" aria-label="Avancement"></ol>
<ul id="trItems" class="track-items"></ul><p class="cart-total" id="trTotal"></p><p id="trWa"></p></section>
<section class="panel" id="chatBox"><h2 data-i18n="trk.chat">Discuter avec le restaurant</h2>
<p id="chatOffline" class="notice hidden" role="status" data-i18n="trk.offline"></p>
<div class="chat-log" id="chatLog" aria-live="polite"></div>
<p id="chatClosed" class="muted hidden" data-i18n="trk.closed"></p>
<form id="chatForm" class="chat-form"><textarea id="chatText" rows="2" maxlength="1000" data-i18n-placeholder="trk.placeholder" data-i18n-aria="trk.placeholder" placeholder="Écrire au restaurant…"></textarea>
<button class="btn" type="submit" data-i18n="trk.send">Envoyer</button></form>
<p id="chatMsg" class="notice" role="alert"></p></section></div></main>
<script type="module" src="/js/pages/track.js"></script></body></html>
