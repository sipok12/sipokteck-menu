<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6e4f"><meta name="referrer" content="strict-origin-when-cross-origin"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230b6e4f%27/%3E%3Cpath d=%27M20 22h24M20 32h24M20 42h14%27 stroke=%27white%27 stroke-width=%275%27 stroke-linecap=%27round%27/%3E%3C/svg%3E"><title>QR Code — SipokMenu</title><meta name="description" content="Générez et imprimez le QR code de votre menu."><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/app.css"><script src="/config.js"></script></head>
<body class="app-body">
<header class="site-header no-print"><a class="logo" href="/">SIPOK<span>MENU</span></a>
<nav><a href="/dashboard" data-i18n="nav.dashboard">Tableau de bord</a><button type="button" class="outline sm" data-lang-toggle data-i18n-aria="nav.language">EN</button></nav></header>
<main class="content"><section class="panel qr-panel">
<small class="eyebrow no-print" data-i18n="qr.eyebrow">VOTRE MENU EN UN SCAN</small>
<h1 id="qrTitle" data-i18n="qr.title">QR code du restaurant</h1>
<p id="qrStatus" class="muted" data-i18n="common.loading">Chargement…</p>
<div id="qrcode" class="qr-box"></div>
<p id="qrScan" class="qr-scan hidden" data-i18n="qr.scan">Scannez pour voir le menu et commander</p>

<div class="btn-row no-print"><button id="downloadQR" type="button" class="btn" disabled data-i18n="qr.download">Télécharger le QR code</button>
<button id="copyLink" type="button" class="btn secondary" disabled data-i18n="qr.copy">Copier le lien</button>
<button id="printQR" type="button" class="btn secondary" data-i18n="qr.print">Imprimer</button></div>
</section></main>
<script type="module" src="/js/pages/qr.js"></script></body></html>
