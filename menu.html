<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6e4f"><meta name="referrer" content="strict-origin-when-cross-origin"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230b6e4f%27/%3E%3Cpath d=%27M20 22h24M20 32h24M20 42h14%27 stroke=%27white%27 stroke-width=%275%27 stroke-linecap=%27round%27/%3E%3C/svg%3E"><title>Menu digital — SipokMenu</title><meta name="description" content="Consultez le menu et commandez en ligne."><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/menu.css"><link rel="stylesheet" href="/css/app.css"><script src="/config.js"></script></head>
<body class="menu-body">
<header class="menu-header"><a class="logo" href="/">SIPOK<span>MENU</span></a>
<div><button id="langToggle" type="button" class="outline sm" data-lang-toggle data-i18n-aria="nav.language">EN</button>
<button id="cartOpen" type="button" class="btn"><span data-i18n="menu.cart">Panier</span> (<span id="cartCount">0</span>)</button></div></header>
<main class="menu-main">
<div id="loading" data-i18n="menu.loading">Chargement du menu…</div>
<div id="error" class="notice hidden" role="alert"></div>
<div id="menu" class="hidden">
<section class="restaurant-hero"><div id="cover" class="cover"></div>
<div class="restaurant-info"><img id="logo" class="resto-logo hidden" alt="" width="72" height="72">
<div><h1 id="restaurantName"></h1><p id="restaurantDesc"></p><small id="restaurantMeta"></small>
<p id="contactLinks" class="contact-links"></p></div></div></section>
<div class="menu-tools"><h2 data-i18n="menu.title">Notre menu</h2>
<input id="search" type="search" data-i18n-placeholder="menu.search" placeholder="Rechercher un plat…" aria-label="Rechercher"></div>
<nav id="categories" class="category-nav" aria-label="Catégories"></nav>
<section id="products" class="product-grid"></section></div></main>
<div id="cartBar" class="cart-bar hidden"><button id="cartBarBtn" type="button" class="btn lg"><span id="cartBarCount"></span> · <span id="cartBarTotal"></span> — <span data-i18n="menu.viewCart">Voir mon panier</span></button></div>
<div id="cartModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="cartTitle"><div class="modal-card cart-card">
<button id="cartClose" type="button" class="close" aria-label="Fermer">×</button>
<h2 id="cartTitle" data-i18n="menu.yourOrder">Votre commande</h2>
<div id="cartLines"></div><p id="cartTotal" class="cart-total"></p>
<form id="checkout" class="stack" novalidate>
<input id="customerName" autocomplete="name" maxlength="120" required data-i18n-placeholder="menu.name" placeholder="Votre nom">
<input id="customerPhone" type="tel" autocomplete="tel" maxlength="20" required data-i18n-placeholder="menu.phone" placeholder="Téléphone">
<select id="orderType" aria-label="Mode"><option value="pickup" data-i18n="menu.pickup">À emporter</option><option value="delivery" data-i18n="menu.delivery">Livraison</option><option value="dine_in" data-i18n="menu.dineIn">Sur place</option></select>
<input id="deliveryAddress" class="hidden" maxlength="500" data-i18n-placeholder="menu.address" placeholder="Adresse de livraison">
<textarea id="customerNote" maxlength="1000" rows="2" data-i18n-placeholder="menu.note" placeholder="Note facultative"></textarea>
<label class="radio"><input type="radio" name="channel" value="internal" checked> <span data-i18n="menu.chanInternal">Enregistrer la commande</span></label>
<label class="radio"><input type="radio" name="channel" value="whatsapp"> <span data-i18n="menu.chanWhatsapp">Envoyer aussi sur WhatsApp</span></label>
<button id="checkoutBtn" class="btn lg" type="submit" data-i18n="menu.confirm">Confirmer la commande</button></form>
<p id="checkoutMessage" class="notice" role="alert"></p>
<div id="confirmation" class="confirmation hidden"></div></div></div>
<script type="module" src="/js/pages/menu.js"></script></body></html>
